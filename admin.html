<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Nova Admin — Customers</title>
    <style>
        :root {
            --primary: #667eea;
            --gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --text: #1f2333;
            --muted: #636a80;
            --bg: #f6f7fc;
            --border: #e4e6f0;
            --radius: 12px;
            --shadow: 0 10px 40px rgba(31, 35, 51, 0.12);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: var(--text);
            background: var(--bg);
            line-height: 1.5;
            min-height: 100vh;
        }

        .hidden {
            display: none !important;
        }

        .btn {
            display: inline-block;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            border: none;
            transition: transform 0.2s, opacity 0.2s;
        }

        .btn:hover {
            transform: translateY(-1px);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-primary {
            background: var(--gradient);
            color: #fff;
        }

        .btn-light {
            background: #fff;
            color: var(--text);
            border: 1px solid var(--border);
        }

        input {
            width: 100%;
            padding: 11px 14px;
            border: 2px solid var(--border);
            border-radius: 8px;
            font-size: 15px;
            font-family: inherit;
            transition: border-color 0.2s;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
        }

        .error {
            color: #c62828;
            font-size: 14px;
            margin-top: 12px;
        }

        /* ---------- Login ---------- */
        .login {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 20px;
            background: var(--gradient);
        }

        .login-card {
            background: #fff;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 40px 32px;
            width: 100%;
            max-width: 400px;
        }

        .login-card h1 {
            font-size: 24px;
            margin-bottom: 6px;
        }

        .login-card p {
            color: var(--muted);
            font-size: 14px;
            margin-bottom: 24px;
        }

        .login-card label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
        }

        .login-card .btn {
            width: 100%;
            margin-top: 16px;
            padding: 12px;
            font-size: 15px;
        }

        /* ---------- Dashboard ---------- */
        .topbar {
            background: #fff;
            border-bottom: 1px solid var(--border);
        }

        .topbar-inner,
        .content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .topbar-inner {
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            font-size: 20px;
            font-weight: 700;
            background: var(--gradient);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .logo small {
            font-size: 13px;
            font-weight: 600;
            color: var(--muted);
            -webkit-text-fill-color: var(--muted);
            margin-left: 6px;
        }

        .content {
            padding-top: 28px;
            padding-bottom: 40px;
        }

        .head {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 16px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .head h1 {
            font-size: 26px;
        }

        .head p {
            color: var(--muted);
            font-size: 14px;
        }

        .toolbar {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }

        .toolbar input {
            flex: 1;
            min-width: 220px;
            background: #fff;
        }

        .card {
            background: #fff;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
        }

        .table-wrap {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        th,
        td {
            text-align: left;
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            vertical-align: top;
        }

        th {
            background: #fafbff;
            color: var(--muted);
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        tbody tr:hover {
            background: #fafbff;
        }

        td.nowrap {
            white-space: nowrap;
        }

        td a {
            color: var(--primary);
            text-decoration: none;
        }

        td a:hover {
            text-decoration: underline;
        }

        .empty {
            text-align: center;
            color: var(--muted);
            padding: 48px 16px;
        }

        /* ---------- Summary cards ---------- */
        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px;
            margin-bottom: 20px;
        }

        .stat {
            background: #fff;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px 18px;
        }

        .stat span {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat strong {
            display: block;
            font-size: 24px;
            margin-top: 4px;
            font-variant-numeric: tabular-nums;
        }

        .stat small {
            color: var(--muted);
            font-size: 13px;
        }

        select {
            padding: 10px 12px;
            border: 2px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            background: #fff;
            color: var(--text);
        }

        select:focus {
            outline: none;
            border-color: var(--primary);
        }

        /* ---------- Status badges ---------- */
        .badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
        }

        .badge-paid { background: #e7f6ec; color: #1b6e36; }
        .badge-dues { background: #fdecec; color: #b42318; }
        .badge-processing { background: #fff4e5; color: #9a5b00; }
        .badge-contacted { background: #eaf0ff; color: #3445b4; }
        .badge-new { background: #f1f2f6; color: #4a5068; }
        .badge-demo { background: #f1f2f6; color: var(--muted); font-weight: 500; margin-left: 6px; }

        td.num {
            text-align: right;
            white-space: nowrap;
            font-variant-numeric: tabular-nums;
        }

        th.num {
            text-align: right;
        }

        .overdue {
            color: #b42318;
            font-weight: 600;
        }

        .muted {
            color: var(--muted);
        }

        .txn small {
            display: block;
            color: var(--muted);
            font-size: 12px;
        }

        /* ---------- Pager ---------- */
        .pager {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 12px 16px;
            border-top: 1px solid var(--border);
            font-size: 14px;
            color: var(--muted);
        }

        .pager div {
            display: flex;
            gap: 8px;
        }

        @media (max-width: 900px) {
            .stats {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        /* Phones: each customer becomes a stacked card */
        @media (max-width: 680px) {
            thead {
                display: none;
            }

            table,
            tbody,
            tr,
            td {
                display: block;
                width: 100%;
            }

            tbody tr {
                padding: 12px 16px;
                border-bottom: 1px solid var(--border);
            }

            td {
                border: none;
                padding: 4px 0;
                display: flex;
                gap: 12px;
            }

            td::before {
                content: attr(data-label);
                flex: 0 0 80px;
                color: var(--muted);
                font-size: 12px;
                font-weight: 600;
                text-transform: uppercase;
                padding-top: 2px;
            }

            td.nowrap {
                white-space: normal;
            }

            td.num {
                text-align: left;
            }

            .stat strong {
                font-size: 20px;
            }

            .pager {
                flex-direction: column;
            }

            .head h1 {
                font-size: 22px;
            }
        }
    </style>
</head>
<body>
    <!-- Login -->
    <section class="login" id="loginView">
        <form class="login-card" id="loginForm">
            <h1>Admin sign in</h1>
            <p>Enter the admin token to view customer details.</p>
            <label for="token">Admin token</label>
            <input type="password" id="token" autocomplete="current-password" required>
            <button type="submit" class="btn btn-primary" id="loginButton">Sign in</button>
            <div class="error hidden" id="loginError" role="alert"></div>
        </form>
    </section>

    <!-- Dashboard -->
    <div class="hidden" id="dashboardView">
        <header class="topbar">
            <div class="topbar-inner">
                <span class="logo">Nova<small>Admin</small></span>
                <button class="btn btn-light" id="logoutButton">Sign out</button>
            </div>
        </header>

        <main class="content">
            <div class="head">
                <div>
                    <h1>Customers</h1>
                    <p id="summary">Loading…</p>
                </div>
            </div>

            <div class="stats" id="stats">
                <div class="stat"><span>Customers</span><strong id="statCount">–</strong><small id="statCountNote"></small></div>
                <div class="stat"><span>Collected</span><strong id="statPaid">–</strong><small id="statPaidNote"></small></div>
                <div class="stat"><span>Outstanding dues</span><strong id="statDue">–</strong><small id="statDueNote"></small></div>
                <div class="stat"><span>Processing</span><strong id="statProcessing">–</strong><small id="statProcessingNote"></small></div>
            </div>

            <div class="toolbar">
                <input type="search" id="search" placeholder="Search name, phone, email, address or transaction ID" aria-label="Search customers">
                <select id="statusFilter" aria-label="Filter by status">
                    <option value="">All statuses</option>
                    <option>Payment completed</option>
                    <option>Dues pending</option>
                    <option>Processing transaction</option>
                    <option>Contacted</option>
                    <option>New lead</option>
                </select>
                <select id="sourceFilter" aria-label="Filter by source">
                    <option value="">Real + demo</option>
                    <option value="real">Real only</option>
                    <option value="demo">Demo only</option>
                </select>
                <button class="btn btn-light" id="refreshButton">Refresh</button>
                <button class="btn btn-primary" id="csvButton">Download CSV</button>
            </div>

            <div class="error hidden" id="loadError" role="alert"></div>

            <div class="card">
                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Customer</th>
                                <th>Contact</th>
                                <th>Status</th>
                                <th>Plan</th>
                                <th class="num">Total</th>
                                <th class="num">Paid</th>
                                <th class="num">Due</th>
                                <th>Due date</th>
                                <th>Last transaction</th>
                                <th>Joined</th>
                            </tr>
                        </thead>
                        <tbody id="rows"></tbody>
                    </table>
                </div>
                <div class="empty hidden" id="empty"></div>
                <div class="pager hidden" id="pager">
                    <span id="pageInfo"></span>
                    <div>
                        <button class="btn btn-light" id="prevPage">Previous</button>
                        <button class="btn btn-light" id="nextPage">Next</button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        const TOKEN_KEY = 'nova-admin-token';
        const PAGE_SIZE = 50;
        const NEW_LEAD = 'New lead';
        const BADGES = {
            'Payment completed': 'badge-paid',
            'Dues pending': 'badge-dues',
            'Processing transaction': 'badge-processing',
            'Contacted': 'badge-contacted',
            [NEW_LEAD]: 'badge-new',
        };
        const CSV_COLUMNS = [
            ['ID', (c) => c.id],
            ['Name', (c) => c.name],
            ['Phone', (c) => c.phone],
            ['Email', (c) => c.email],
            ['Address', (c) => c.address],
            ['Status', (c) => statusOf(c)],
            ['Plan', (c) => c.plan],
            ['Total (INR)', (c) => c.total_amount],
            ['Paid (INR)', (c) => c.amount_paid],
            ['Due (INR)', (c) => c.amount_due],
            ['Due date', (c) => c.due_date],
            ['Last transaction ID', (c) => c.last_transaction?.id],
            ['Transaction date', (c) => c.last_transaction?.date],
            ['Transaction amount (INR)', (c) => c.last_transaction?.amount],
            ['Payment method', (c) => c.last_transaction?.method],
            ['Transaction status', (c) => c.last_transaction?.status],
            ['Source', (c) => (c.is_demo ? 'Demo' : 'Website form')],
            ['Joined', (c) => c.created_at],
        ];

        const $ = (id) => document.getElementById(id);
        const inr = new Intl.NumberFormat('en-IN', { style: 'currency', currency: 'INR', maximumFractionDigits: 0 });
        const num = (n) => n.toLocaleString('en-IN');
        const today = new Date().toISOString().slice(0, 10);
        let customers = [];
        let shown = [];
        let page = 0;

        // Website form sign-ups have no payment details yet; they count as new leads.
        const statusOf = (c) => c.status || NEW_LEAD;
        const isOverdue = (c) => c.amount_due > 0 && c.due_date && c.due_date < today;

        // The token lives only for this browser tab and is cleared on sign out.
        function getToken() {
            try { return sessionStorage.getItem(TOKEN_KEY) || ''; } catch { return ''; }
        }

        function setToken(value) {
            try {
                if (value) sessionStorage.setItem(TOKEN_KEY, value);
                else sessionStorage.removeItem(TOKEN_KEY);
            } catch { /* storage unavailable: token is kept in memory only */ }
            memoryToken = value;
        }

        let memoryToken = getToken();

        function showView(loggedIn) {
            $('loginView').classList.toggle('hidden', loggedIn);
            $('dashboardView').classList.toggle('hidden', !loggedIn);
        }

        function formatDate(iso, withTime = true) {
            if (!iso) return '';
            const date = new Date(iso);
            if (Number.isNaN(date.getTime())) return iso;
            const options = { day: 'numeric', month: 'short', year: 'numeric' };
            if (withTime) Object.assign(options, { hour: 'numeric', minute: '2-digit' });
            return date.toLocaleString('en-IN', options);
        }

        const money = (value) => (typeof value === 'number' ? inr.format(value) : '–');

        async function fetchCustomers(token) {
            const response = await fetch('/api/customers', {
                headers: { 'X-Admin-Token': token },
                cache: 'no-store',
            });
            if (response.status === 401) {
                const err = new Error('unauthorized');
                err.unauthorized = true;
                throw err;
            }
            if (!response.ok) throw new Error(`Server returned ${response.status}`);
            const data = await response.json();
            return data.customers || [];
        }

        // Customer data comes from the public form, so it is only ever
        // inserted as text, never as HTML.
        function el(tag, text, className) {
            const node = document.createElement(tag);
            if (text != null) node.textContent = text;
            if (className) node.className = className;
            return node;
        }

        function cell(row, label, text) {
            const td = el('td', text);
            td.dataset.label = label;
            row.appendChild(td);
            return td;
        }

        function link(text, href) {
            const a = el('a', text);
            a.href = href;
            return a;
        }

        function block(text, className = 'muted') {
            const small = el('small', text, className);
            small.style.display = 'block';
            return small;
        }

        function applyFilters() {
            const query = $('search').value.trim().toLowerCase();
            const status = $('statusFilter').value;
            const source = $('sourceFilter').value;

            shown = customers.filter((c) => {
                if (status && statusOf(c) !== status) return false;
                if (source === 'real' && c.is_demo) return false;
                if (source === 'demo' && !c.is_demo) return false;
                if (!query) return true;
                return [c.name, c.phone, c.email, c.address, c.last_transaction?.id]
                    .some((v) => String(v || '').toLowerCase().includes(query));
            });
            page = 0;
            render();
        }

        function renderStats() {
            const sum = (list, get) => list.reduce((total, c) => total + (get(c) || 0), 0);
            const demo = shown.filter((c) => c.is_demo).length;
            const withDues = shown.filter((c) => c.amount_due > 0);
            const overdue = shown.filter(isOverdue).length;
            const processing = shown.filter((c) => statusOf(c) === 'Processing transaction');
            const fullyPaid = shown.filter((c) => statusOf(c) === 'Payment completed').length;

            $('statCount').textContent = num(shown.length);
            $('statCountNote').textContent = `${num(shown.length - demo)} real · ${num(demo)} demo`;
            $('statPaid').textContent = inr.format(sum(shown, (c) => c.amount_paid));
            $('statPaidNote').textContent = `${num(fullyPaid)} fully paid`;
            $('statDue').textContent = inr.format(sum(withDues, (c) => c.amount_due));
            $('statDueNote').textContent = `${num(withDues.length)} customers · ${num(overdue)} overdue`;
            $('statProcessing').textContent = num(processing.length);
            $('statProcessingNote').textContent = `${inr.format(sum(processing, (c) => c.last_transaction?.amount))} in progress`;
        }

        function render() {
            renderStats();

            const pages = Math.max(1, Math.ceil(shown.length / PAGE_SIZE));
            page = Math.max(0, Math.min(page, pages - 1));
            const start = page * PAGE_SIZE;
            const slice = shown.slice(start, start + PAGE_SIZE);

            const tbody = $('rows');
            tbody.replaceChildren();

            slice.forEach((c, i) => {
                const row = document.createElement('tr');
                cell(row, '#', String(start + i + 1));

                const name = cell(row, 'Customer');
                name.append(el('strong', c.name || ''));
                if (c.is_demo) name.append(el('span', 'demo', 'badge badge-demo'));

                const contact = cell(row, 'Contact');
                if (c.phone) contact.append(link(c.phone, `tel:${c.phone.replace(/[^\d+]/g, '')}`));
                if (c.email) contact.append(el('br'), link(c.email, `mailto:${c.email}`));
                if (c.address) contact.append(block(c.address));

                const status = statusOf(c);
                cell(row, 'Status').append(el('span', status, `badge ${BADGES[status] || 'badge-new'}`));
                cell(row, 'Plan', c.plan || '–');
                cell(row, 'Total', money(c.total_amount)).classList.add('num');
                cell(row, 'Paid', money(c.amount_paid)).classList.add('num');
                cell(row, 'Due', money(c.amount_due)).classList.add('num');

                const due = cell(row, 'Due date', c.due_date ? formatDate(c.due_date, false) : '–');
                due.classList.add('nowrap');
                if (isOverdue(c)) {
                    due.classList.add('overdue');
                    due.append(block('Overdue', ''));
                }

                const t = c.last_transaction;
                const txn = cell(row, 'Transaction', t ? `${t.status} · ${money(t.amount)}` : '–');
                txn.classList.add('txn');
                if (t) txn.append(el('small', `${t.method} · ${t.id}`), el('small', formatDate(t.date)));

                cell(row, 'Joined', formatDate(c.created_at)).classList.add('nowrap');
                tbody.appendChild(row);
            });

            const total = customers.length;
            $('summary').textContent = shown.length !== total
                ? `Showing ${num(shown.length)} of ${num(total)} customers`
                : `${num(total)} customers in total`;

            const empty = $('empty');
            empty.classList.toggle('hidden', shown.length > 0);
            empty.textContent = total === 0 ? 'No customers yet.' : 'No customers match these filters.';
            $('csvButton').disabled = shown.length === 0;

            $('pager').classList.toggle('hidden', shown.length <= PAGE_SIZE);
            $('pageInfo').textContent = shown.length
                ? `${num(start + 1)}–${num(start + slice.length)} of ${num(shown.length)}`
                : '';
            $('prevPage').disabled = page === 0;
            $('nextPage').disabled = page >= pages - 1;
        }

        async function load() {
            $('loadError').classList.add('hidden');
            $('refreshButton').disabled = true;
            $('refreshButton').textContent = 'Loading…';
            try {
                customers = await fetchCustomers(memoryToken);
                applyFilters();
            } catch (err) {
                if (err.unauthorized) {
                    signOut('Your session has expired or the token changed. Please sign in again.');
                    return;
                }
                $('loadError').textContent = 'Could not load customers. Please try again.';
                $('loadError').classList.remove('hidden');
            } finally {
                $('refreshButton').disabled = false;
                $('refreshButton').textContent = 'Refresh';
            }
        }

        function signOut(message) {
            setToken('');
            customers = [];
            shown = [];
            $('rows').replaceChildren();
            $('search').value = '';
            $('statusFilter').value = '';
            $('sourceFilter').value = '';
            $('token').value = '';
            const loginError = $('loginError');
            loginError.textContent = message || '';
            loginError.classList.toggle('hidden', !message);
            showView(false);
        }

        // Prefix cells that a spreadsheet would treat as a formula.
        function csvCell(value) {
            let text = String(value ?? '');
            if (/^[=+\-@\t\r]/.test(text)) text = `'${text}`;
            return /[",\n\r]/.test(text) ? `"${text.replace(/"/g, '""')}"` : text;
        }

        function downloadCsv() {
            const lines = [CSV_COLUMNS.map(([label]) => csvCell(label)).join(',')];
            shown.forEach((c) => {
                lines.push(CSV_COLUMNS.map(([, get]) => csvCell(get(c))).join(','));
            });

            // BOM so Excel opens the file as UTF-8.
            const blob = new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `customers-${today}.csv`;
            document.body.appendChild(a);
            a.click();
            a.remove();
            URL.revokeObjectURL(url);
        }

        $('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const token = $('token').value.trim();
            if (!token) return;

            const button = $('loginButton');
            button.disabled = true;
            button.textContent = 'Signing in…';
            $('loginError').classList.add('hidden');

            try {
                customers = await fetchCustomers(token);
                setToken(token);
                $('token').value = '';
                showView(true);
                applyFilters();
            } catch (err) {
                $('loginError').textContent = err.unauthorized
                    ? 'That token is not correct.'
                    : 'Could not reach the server. Please try again.';
                $('loginError').classList.remove('hidden');
            } finally {
                button.disabled = false;
                button.textContent = 'Sign in';
            }
        });

        $('search').addEventListener('input', applyFilters);
        $('statusFilter').addEventListener('change', applyFilters);
        $('sourceFilter').addEventListener('change', applyFilters);
        $('refreshButton').addEventListener('click', load);
        $('csvButton').addEventListener('click', downloadCsv);
        $('logoutButton').addEventListener('click', () => signOut());
        $('prevPage').addEventListener('click', () => { page -= 1; render(); window.scrollTo(0, 0); });
        $('nextPage').addEventListener('click', () => { page += 1; render(); window.scrollTo(0, 0); });

        if (memoryToken) {
            showView(true);
            load();
        } else {
            showView(false);
        }
    </script>
</body>
</html>
